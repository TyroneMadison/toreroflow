<!doctype html><meta charset="utf-8">
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text",system-ui,"Segoe UI",Roboto,sans-serif;background:#111;color:#eee}
.bars{display:flex;align-items:flex-end;gap:16px;height:150px;padding:8px 6px 0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;justify-content:flex-end;height:100%}
.bar .fill{width:100%;border-radius:9px 9px 4px 4px;background:#48f}
.bar .bl{font-size:11px;color:#999}
.bar .bv{font-size:11.5px;font-weight:600}
.anwrap .bars{overflow:hidden}
.anwrap .bar{min-width:0}
.anwrap .bar .bv{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>
<div id="out" style="font:12px monospace;white-space:pre"></div>
<script>
const VALS=["123.4K","999.9K","12.3K","1.23M","456"];
function mk(w,val){
  const host=document.createElement('div');
  host.className='anwrap';host.style.width=w+'px';
  host.innerHTML='<div class="bars">'+Array.from({length:10},()=>
    `<div class="bar"><div class="bv">${val}</div><div class="fill" style="height:50%"></div><div class="bl">12/31</div></div>`).join('')+'</div>';
  document.body.appendChild(host);
  const bar=host.querySelector('.bar'), bv=host.querySelector('.bv'), bl=host.querySelector('.bl');
  const bw=bar.getBoundingClientRect().width;
  const r={bar:+bw.toFixed(2), bvNeeded:bv.scrollWidth, bvBox:+bv.getBoundingClientRect().width.toFixed(2),
    clipped:bv.scrollWidth>Math.ceil(bv.getBoundingClientRect().width),
    blNeeded:bl.scrollWidth, blOverflow:bl.scrollWidth>Math.ceil(bw)};
  host.remove();return r;
}
const cases=[
 ["win 1920 (300col)",  1920-48-240-48], ["win 1600 (300col)",1600-48-240-48],
 ["win 1551 (300col)",  1551-48-240-48], ["win 1550 (240col)",1550-48-240-48],
 ["win 1400 (240col)",  1400-48-240-48], ["win 1301 (240col)",1301-48-240-48],
 ["win 1300 (1col)",    1300-48-240-48], ["win 1008 (1col rail)",1008-48-64-48],
 ["win 900 (rail)",      900-48-64-48],  ["win 640 (rail small)",640-48-64-24],
 ["win 480 (rail small)",480-48-64-24],  ["win 400 (rail small)",400-48-64-24],
];
let s='';
for(const [name,anwrap] of cases){
  const small = name.includes('small');
  const cardPad = small?16:20;
  let mid;
  if(name.includes('300col')) mid = anwrap-600-32;
  else if(name.includes('240col')) mid = anwrap-480-32;
  else mid = anwrap;
  const barsW = mid - cardPad*2;
  s+=`\n=== ${name}  anwrap=${anwrap} midcol=${mid} barsBox=${barsW}\n`;
  for(const v of VALS){
    const r=mk(barsW,v);
    s+=`  ${v.padEnd(7)} bar=${String(r.bar).padStart(6)}  needs=${String(r.bvNeeded).padStart(3)} box=${String(r.bvBox).padStart(6)} CLIPPED=${r.clipped}  bl"12/31"needs=${r.blNeeded} overflowsBar=${r.blOverflow}\n`;
  }
}
document.getElementById('out').textContent=s;
</script>
