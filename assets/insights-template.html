<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Your game plan</title>
<style>
  /*
    Torerone brand, lifted from Torerone_Portfolio_Canva.pptx.pdf: near black
    page, slightly lighter cards with a faint border, coral accent, cool grey
    body text. The portfolio sets headlines in Anton and body in Montserrat.
    Neither is installed and this prints offline in headless Chrome, so the
    closest local pair stands in: Impact for the condensed headline, Segoe UI
    for everything else.
  */
  @page { size: Letter; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #0B0B10;
    color: #FFFFFF;
    font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
    font-size: 10.5pt;
    line-height: 1.55;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  /* Tuned so six steps and the header land on one page: a game plan the
     client has to turn over is a game plan they read half of. */
  .page { padding: 0.5in 0.62in 0.42in; }

  .brand {
    font-family: Impact, "Haettenschweiler", "Arial Narrow", sans-serif;
    font-size: 14pt; letter-spacing: 4.5px; color: #FFFFFF;
    margin: 0 0 20px;
  }
  .eyebrow {
    font-size: 8pt; font-weight: 700; letter-spacing: 3px; text-transform: uppercase;
    color: #FF6F61; margin: 0 0 8px;
  }
  h1 {
    font-family: Impact, "Haettenschweiler", "Arial Narrow", sans-serif;
    font-size: 34pt; line-height: 0.94; letter-spacing: 0.5px;
    text-transform: uppercase; margin: 0; color: #FFFFFF;
  }
  h1 .accent { color: #FF6F61; }
  .rule { width: 68px; height: 4px; background: #FF6F61; margin: 10px 0 14px; }
  .lede { color: #A6A6B4; font-size: 10pt; max-width: 5.4in; margin: 0 0 18px; }

  .step {
    display: flex; gap: 14px; align-items: flex-start;
    background: #14141C; border: 1px solid #282834; border-radius: 10px;
    padding: 11px 15px; margin-bottom: 8px;
    break-inside: avoid; page-break-inside: avoid;
  }
  .step .n {
    font-family: Impact, "Haettenschweiler", "Arial Narrow", sans-serif;
    font-size: 19pt; line-height: 1; color: #FF6F61;
    min-width: 27px; flex: 0 0 auto; padding-top: 1px;
  }
  .step .tag {
    display: inline-block; font-size: 7pt; font-weight: 700; letter-spacing: 1.6px;
    text-transform: uppercase; color: #FF8160; margin: 0 0 4px;
  }
  .step h2 { font-size: 11.5pt; font-weight: 700; margin: 0 0 3px; color: #FFFFFF; }
  .step p { margin: 0; color: #B9B9C6; font-size: 9.5pt; }
  .empty { color: #9A9AA8; }

  footer {
    margin-top: 18px; padding-top: 11px; border-top: 1px solid #282834;
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 8pt; letter-spacing: 1.6px; text-transform: uppercase;
    color: #6E6E7E;
  }
  footer .mark { color: #FF6F61; font-weight: 700; }
</style>
</head>
<body>
<div class="page">
  <p class="brand">TORERONE</p>

  <p class="eyebrow">Your game plan</p>
  <h1 id="head">What to do <span class="accent">next</span></h1>
  <div class="rule"></div>
  <p class="lede" id="lede"></p>

  <main id="steps"></main>

  <footer>
    <span class="mark">TORERONE</span>
    <span id="when"></span>
  </footer>
</div>

<script>
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function render(data) {
    var brand = (data && data.clientName) || "";
    document.title = brand ? brand + " - your game plan" : "Your game plan";
    document.getElementById("lede").textContent = brand
      ? "Here is what to work on next, " + brand + ". Take them in order."
      : "Here is what to work on next. Take them in order.";
    document.getElementById("when").textContent = (data && data.generatedLabel) || "";

    var list = (data && data.suggestions) || [];
    var host = document.getElementById("steps");
    if (!list.length) {
      host.innerHTML = '<p class="empty">No steps this time. Keep posting on your usual schedule.</p>';
      return;
    }
    host.innerHTML = list
      .map(function (s, i) {
        return (
          '<section class="step">' +
          '<div class="n">' + (i + 1) + "</div>" +
          "<div>" +
          (s.category ? '<div class="tag">' + esc(s.category) + "</div>" : "") +
          "<h2>" + esc(s.title) + "</h2>" +
          "<p>" + esc(s.detail) + "</p>" +
          "</div></section>"
        );
      })
      .join("");
  }

  render(window.REPORT_DATA || {});
</script>
</body>
</html>
