<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>What to do next</title>
<style>
  @page { size: Letter; margin: 0.6in 0.65in; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Inter, system-ui, -apple-system, sans-serif;
    color: #17161d;
    font-size: 11pt;
    line-height: 1.5;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  header { border-bottom: 2px solid #8b7bff; padding-bottom: 14px; margin-bottom: 22px; }
  .kicker {
    font-size: 8.5pt; letter-spacing: 1.6px; text-transform: uppercase;
    color: #8b7bff; font-weight: 700; margin: 0 0 6px;
  }
  h1 { font-size: 21pt; margin: 0 0 4px; font-weight: 650; letter-spacing: -0.3px; }
  .sub { font-size: 9.5pt; color: #6c6a7a; margin: 0; }
  .internal {
    display: inline-block; margin-top: 12px; font-size: 8pt; font-weight: 700;
    letter-spacing: 0.8px; text-transform: uppercase; color: #8a5a00;
    background: #fff2d6; border: 1px solid #f0d391; border-radius: 4px; padding: 3px 9px;
  }
  .item { break-inside: avoid; page-break-inside: avoid; margin-bottom: 18px; }
  .item .cat {
    display: inline-block; font-size: 7.5pt; font-weight: 700; letter-spacing: 0.9px;
    text-transform: uppercase; color: #4b3fb8; background: #eeecfd;
    border-radius: 4px; padding: 2px 8px; margin-bottom: 5px;
  }
  .item h2 { font-size: 12pt; margin: 0 0 3px; font-weight: 640; }
  .item p { margin: 0; color: #3c3a48; }
  .num { color: #a9a6b6; font-weight: 640; margin-right: 6px; }
  .empty { color: #6c6a7a; font-style: italic; }
  footer {
    margin-top: 26px; padding-top: 10px; border-top: 1px solid #e3e1ea;
    font-size: 8.5pt; color: #8a8796;
  }
</style>
</head>
<body>
<header>
  <p class="kicker">What to do next</p>
  <h1 id="brand">Client</h1>
  <p class="sub" id="when"></p>
  <span class="internal">Internal working document, not for the client</span>
</header>

<main id="items"></main>

<footer>Generated by Toreroflow. These are working notes about the account, written for the operator.</footer>

<script>
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function render(data) {
    var brand = (data && data.clientName) || "Client";
    document.getElementById("brand").textContent = brand;
    document.title = brand + " - what to do next";
    document.getElementById("when").textContent = (data && data.generatedLabel) || "";

    var list = (data && data.suggestions) || [];
    var host = document.getElementById("items");
    if (!list.length) {
      host.innerHTML = '<p class="empty">No suggestions were produced for this run.</p>';
      return;
    }
    host.innerHTML = list
      .map(function (s, i) {
        return (
          '<section class="item">' +
          '<span class="cat">' + esc(s.category) + "</span>" +
          '<h2><span class="num">' + (i + 1) + ".</span>" + esc(s.title) + "</h2>" +
          "<p>" + esc(s.detail) + "</p>" +
          "</section>"
        );
      })
      .join("");
  }

  render(window.REPORT_DATA || {});
</script>
</body>
</html>
