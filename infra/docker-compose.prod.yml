# The whole server, on one box.
#
#   docker compose -f infra/docker-compose.prod.yml up -d
#
# Nothing here publishes a port to the internet. Postgres is reachable only
# over the compose network; the API is bound to loopback and reached through
# Tailscale, which terminates TLS and holds the certificate.
# On a fresh VPS with no firewall a published 5432 is found and attacked within
# the hour, so the rule is that the open internet gets nothing at all.
#
# Every secret comes from infra/.env, which is not in this repository. See
# infra/.env.example and DEPLOY.md.

# A different project name from infra/docker-compose.yml on purpose. Compose
# scopes volumes and container names to the project, so sharing a name means
# the dev stack and this one share a database volume. Postgres only ever sets
# its password on the first init of a data directory, so the second stack to
# start inherits the first one's credentials and fails to authenticate with
# its own. Worse on a laptop: `down -v` on one wipes the other.
name: toreroflow-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: toreroflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: toreroflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toreroflow -d toreroflow"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://toreroflow:${POSTGRES_PASSWORD}@postgres:5432/toreroflow
      STORAGE_DIR: /app/storage
      # The caption button transcribes a transcript-less video on demand.
      CAPTIONS_URL: http://captions:4710
      # What the Ship card shows as "server is running". Set by the scripts
      # that bring the stack up; empty is honest rather than wrong.
      GIT_COMMIT: ${GIT_COMMIT:-}
    # Loopback only. Tailscale proxies to this from the tailnet; binding it to
    # 0.0.0.0 would put the API on the open internet, which is the entire thing
    # this arrangement exists to avoid. ufw would also have to allow it, and it
    # does not.
    ports:
      - "127.0.0.1:4700:4700"
    volumes:
      - storage:/app/storage
      # The only thing this container can do to the host: drop a deploy request
      # here for the watcher to pick up. Not the docker socket, deliberately.
      - ./../deploy:/app/deploy
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      # Node rather than curl: the slim image has no curl and adding one for a
      # healthcheck is a package to keep patched forever.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4700/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Transcription. Nothing user-facing talks to it; the worker calls it while
  # processing an upload, and a video without a transcript still publishes, so
  # this being down costs AI drafts and nothing else.
  captions:
    build:
      context: ..
      dockerfile: infra/Dockerfile.captions
    restart: unless-stopped
    volumes:
      # Read-only: it is handed an absolute path to a video the API stored and
      # has no reason to write anything back.
      - storage:/app/storage:ro
      # The whisper model, kept across rebuilds so it downloads once.
      - whispermodels:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4710/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      # The first transcribe loads the model, which is slower than a boot.
      start_period: 60s

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://toreroflow:${POSTGRES_PASSWORD}@postgres:5432/toreroflow
      STORAGE_DIR: /app/storage
      # Both sides mount the same storage volume at the same path, so the
      # absolute path the worker sends resolves to the same file here.
      CAPTIONS_URL: http://captions:4710
    volumes:
      # The same volume the API writes uploads into. The worker transcodes what
      # the API received and the API serves what the worker produced, so this
      # has to be one directory and not two.
      - storage:/app/storage
    depends_on:
      postgres: { condition: service_healthy }
      # Waits for the API, not just the database, because the API is what runs
      # the migrations and it only reports healthy once they are applied. On a
      # first boot the worker otherwise wins the race, asks for a table that
      # does not exist yet, dies with P2021 and crash-loops until the schema
      # catches up. It recovers on its own, but a container restarting on a
      # fresh deploy is exactly the thing that reads as a broken deploy.
      api: { condition: service_healthy }


volumes:
  pgdata:
  storage:
  whispermodels:
