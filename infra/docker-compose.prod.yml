# The whole server, on one box.
#
#   docker compose -f infra/docker-compose.prod.yml up -d
#
# Postgres is reachable only over the compose network, and it stays that way.
# On a fresh VPS with no firewall a published 5432 is found and attacked within
# the hour, so the data layer gets nothing from the open internet, ever.
#
# The API is a different case, and the comment here used to overstate it. It has
# been publicly reachable the whole time: Tailscale Funnel serves it at
# toreroflow-server.tail0aa167.ts.net, terminating TLS in tailscaled. The API is
# bound to loopback so that tailscaled is the only thing that can reach it
# directly, not because the API is private.
#
# Caddy, added 2026-08-11, is a second public door to that same already-public
# API, on a name we own. It exists because OAuth redirect URIs go in front of
# platform reviewers at Meta, Google and TikTok, and a .ts.net hostname reads as
# a hobby project. Both doors lead to the same place behind the same auth, so
# this widens the surface by a port, not by a capability.
#
# Every secret comes from infra/.env, which is not in this repository. See
# infra/.env.example and DEPLOY.md.

# A different project name from infra/docker-compose.yml on purpose. Compose
# scopes volumes and container names to the project, so sharing a name means
# the dev stack and this one share a database volume. Postgres only ever sets
# its password on the first init of a data directory, so the second stack to
# start inherits the first one's credentials and fails to authenticate with
# its own. Worse on a laptop: `down -v` on one wipes the other.
name: toreroflow-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: toreroflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/.env}
      POSTGRES_DB: toreroflow
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toreroflow -d toreroflow"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://toreroflow:${POSTGRES_PASSWORD}@postgres:5432/toreroflow
      STORAGE_DIR: /app/storage
      # The caption button transcribes a transcript-less video on demand.
      CAPTIONS_URL: http://captions:4710
      # What the Ship card shows as "server is running". Set by the scripts
      # that bring the stack up; empty is honest rather than wrong.
      GIT_COMMIT: ${GIT_COMMIT:-}
    # Loopback only. Tailscale proxies to this from the tailnet; binding it to
    # 0.0.0.0 would put the API on the open internet, which is the entire thing
    # this arrangement exists to avoid. ufw would also have to allow it, and it
    # does not.
    ports:
      - "127.0.0.1:4700:4700"
    volumes:
      - storage:/app/storage
      # The only thing this container can do to the host: drop a deploy request
      # here for the watcher to pick up. Not the docker socket, deliberately.
      - ./../deploy:/app/deploy
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      # Node rather than curl: the slim image has no curl and adding one for a
      # healthcheck is a package to keep patched forever.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4700/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Transcription. Nothing user-facing talks to it directly. The caption button
  # asks for words when it needs them, and the editor and analyzer cannot work
  # without them, but a video publishes fine with no transcript at all, so this
  # being down costs drafts and edits rather than posts.
  captions:
    build:
      context: ..
      dockerfile: infra/Dockerfile.captions
    restart: unless-stopped
    volumes:
      # Read-write since voice isolation: /separate writes its stems here for
      # the worker to pick up. Transcription still only reads.
      - storage:/app/storage
      # The whisper model, kept across rebuilds so it downloads once.
      - whispermodels:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:4710/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
      # The first transcribe loads the model, which is slower than a boot.
      start_period: 60s

  worker:
    build:
      context: ..
      dockerfile: infra/Dockerfile
      target: worker
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://toreroflow:${POSTGRES_PASSWORD}@postgres:5432/toreroflow
      STORAGE_DIR: /app/storage
      # Both sides mount the same storage volume at the same path, so the
      # absolute path the worker sends resolves to the same file here.
      CAPTIONS_URL: http://captions:4710
    volumes:
      # The same volume the API writes uploads into. The worker transcodes what
      # the API received and the API serves what the worker produced, so this
      # has to be one directory and not two.
      - storage:/app/storage
    depends_on:
      postgres: { condition: service_healthy }
      # Waits for the API, not just the database, because the API is what runs
      # the migrations and it only reports healthy once they are applied. On a
      # first boot the worker otherwise wins the race, asks for a table that
      # does not exist yet, dies with P2021 and crash-loops until the schema
      # catches up. It recovers on its own, but a container restarting on a
      # fresh deploy is exactly the thing that reads as a broken deploy.
      api: { condition: service_healthy }

  # HTTPS for the API on our own domain, so an OAuth redirect URI can be
  # https://api.torerone.com/... rather than a .ts.net hostname.
  #
  # Caddy requests and renews the Let's Encrypt certificate itself; there is no
  # certbot and no renewal to forget. Two things it needs:
  #
  #   1. API_DOMAIN must resolve to this box BEFORE the container starts,
  #      because the ACME challenge is answered on port 80. If it does not,
  #      Caddy backs off and retries, and no certificate is served meanwhile.
  #   2. The caddydata volume must persist. Let's Encrypt rate limits issuance
  #      per domain per week, so throwing certificates away on every deploy is
  #      how a deploy loop turns into a week-long outage.
  #
  # It reaches the API as api:4700 over the compose network, which is why the
  # API's own loopback binding does not get in the way.
  #
  # The ports are bound to the PUBLIC addresses specifically, never to 0.0.0.0.
  # tailscaled already listens on 443 on the tailnet addresses for Funnel, and a
  # wildcard bind conflicts with any specific bind on the same port, so
  # "443:443" fails with EADDRINUSE and takes the whole deploy down with it.
  # Naming the public addresses lets the two coexist: Funnel keeps serving the
  # .ts.net name, Caddy serves api.torerone.com.
  #
  # IPv6 is bound because an AAAA record exists for API_DOMAIN, and Let's
  # Encrypt prefers IPv6 when it finds one. Listening on IPv4 alone would fail
  # the ACME challenge even though the name resolves.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in infra/.env}
    ports:
      - "${PUBLIC_IPV4:?set PUBLIC_IPV4 in infra/.env}:80:80"
      - "${PUBLIC_IPV4}:443:443"
      - "[${PUBLIC_IPV6:?set PUBLIC_IPV6 in infra/.env}]:80:80"
      - "[${PUBLIC_IPV6}]:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      api: { condition: service_healthy }


volumes:
  pgdata:
  storage:
  whispermodels:
  # Holds the certificate and the ACME account key. Losing this means asking
  # Let's Encrypt for a fresh certificate, which is rate limited.
  caddydata:
  caddyconfig:
