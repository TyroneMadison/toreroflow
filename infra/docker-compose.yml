name: toreroflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: toreroflow-postgres
    environment:
      POSTGRES_USER: toreroflow
      POSTGRES_PASSWORD: toreroflow
      POSTGRES_DB: toreroflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toreroflow -d toreroflow"]
      interval: 5s
      timeout: 3s
      retries: 20


volumes:
  pgdata:
