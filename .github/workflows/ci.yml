name: CI

# Runs the workspace checks on every pull request so merges are gated on
# real results. No secrets and nothing paid: a stock Ubuntu runner only.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The Prisma client is generated, not committed; typecheck imports it.
      - run: pnpm db:generate

      - run: pnpm -r typecheck

      - run: pnpm -r test
